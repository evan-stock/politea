name: manual-draft
# 채팅에서 쓴 원고(drafts/current.json)를 렌더링한다. Claude API 비용 없음.
# mode=collect: 후보 사진 모으기 / render: 카드·릴스 만들기 / send: 텔레그램 미리보기 + 게시 대기
on:
  push:
    paths: ["drafts/current.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: manual
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq ffmpeg
      - name: 렌더
        id: run
        run: python -m cardnews.manual drafts/current.json 2>&1 | tee /tmp/manual.log; exit ${PIPESTATUS[0]}
      - name: 실패 알림
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          msg="⚠️ 폴리티커 원고 렌더 실패
          $(tail -c 500 /tmp/manual.log)

          GitHub Actions 로그를 확인해주세요."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" > /dev/null
      - if: always()
        run: |
          git config user.name politea-bot; git config user.email politea-bot@users.noreply.github.com
          git add -A media state
          git diff --cached --quiet || (git commit -m "manual: render" && git pull --rebase && git push)
      - name: 게시 대기 감시 시작
        run: |
          if grep -q '"mode": *"send"' drafts/current.json; then
            gh workflow run pipeline.yml -f cmd=watch
          fi
        env:
          GH_TOKEN: ${{ github.token }}
