name: jjirasi-scan
# 텔레그램 공개 채널(@koreajjirasi)에서 반응 좋은 사진·영상 후보를 모은다.
# 예약 작업(Claude)이 drafts/scan.json 을 push하면 실행 → state/jjirasi/candidates.json + media/<id>/
on:
  push:
    paths: ["drafts/scan.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jjirasi
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq ffmpeg
      - name: 후보 수집
        run: python -m cardnews.jjirasi scan
      - if: always()
        run: |
          git config user.name politea-bot; git config user.email politea-bot@users.noreply.github.com
          git add -A media state
          git diff --cached --quiet || (git commit -m "jjirasi: scan $(date +%m%d_%H%M)" && git pull --rebase && git push)
